<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:339px;height:962px;background:#FFFFFF;" width="339px" height="962px" viewBox="0 0 339 962" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--entity s1--><g class="entity" data-qualified-name="s1" id="ent0001" data-source-line="5"><rect x="40" y="12" width="248.815" height="60.544" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="50" y="38.24" fill="#000" font-size="14" textLength="135.463" font-family="'Noto Sans CJK SC'">1. 定义 MCU 资源预算</text><text x="50" y="58.512" fill="#000" font-size="14" textLength="228.815" font-family="'Noto Sans CJK SC'">(ROM/RAM/Stack/ISR Latency 限额)</text></g><!--entity s2--><g class="entity" data-qualified-name="s2" id="ent0002" data-source-line="6"><rect x="55.5" y="109" width="218.015" height="60.544" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="65.5" y="135.24" fill="#000" font-size="14" textLength="70.798" font-family="'Noto Sans CJK SC'">2. 静态设计</text><text x="65.5" y="155.512" fill="#000" font-size="14" textLength="198.015" font-family="'Noto Sans CJK SC'">(任务规划 / 缓冲尺寸 / IPC 选型)</text></g><!--entity s3--><g class="entity" data-qualified-name="s3" id="ent0003" data-source-line="7"><rect x="45.5" y="206" width="237.755" height="60.544" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="55.5" y="232.24" fill="#000" font-size="14" textLength="70.798" font-family="'Noto Sans CJK SC'">3. 编译分析</text><text x="55.5" y="252.512" fill="#000" font-size="14" textLength="217.755" font-family="'Noto Sans CJK SC'">(生成 ELF + .map + .su 静态调用图)</text></g><!--entity s4--><g class="entity" data-qualified-name="s4" id="ent0004" data-source-line="8"><rect x="51" y="303" width="227.493" height="60.544" fi