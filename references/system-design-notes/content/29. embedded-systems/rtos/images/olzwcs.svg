<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:345px;height:446px;background:#FFFFFF;" width="345px" height="446px" viewBox="0 0 345 446" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--entity p1--><g class="entity" data-qualified-name="p1" id="ent0001" data-source-line="5"><rect x="15.5" y="12" width="304.157" height="60.544" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="25.5" y="38.24" fill="#000" font-size="14" textLength="194.389" font-family="'Noto Sans CJK SC'">1. Task Notification (任务通知)</text><text x="25.5" y="58.512" fill="#000" font-size="14" textLength="284.157" font-family="'Noto Sans CJK SC'">(最轻量：零额外 RAM 控制块，直接利用 TCB)</text></g><!--entity p2--><g class="entity" data-qualified-name="p2" id="ent0002" data-source-line="6"><rect x="15" y="131" width="305.025" height="60.544" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="25" y="157.24" fill="#000" font-size="14" textLength="235.311" font-family="'Noto Sans CJK SC'">2. SPSC Ring Buffer (无锁单产单消环)</text><text x="25" y="177.512" fill="#000" font-size="14" textLength="285.025" font-family="'Noto Sans CJK SC'">(仅需静态数组与 head/tail 索引，无阻塞开销)</text></g><!--entity p3--><g class="entity" data-qualified-name="p3" id="ent0003" data-source-line="7"><rect x="20" y="250" width="295.463" height="60.544" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="30" y="276.24" fill="#000" font-size="14" textLength="167.117" font-family="'Noto Sans CJK SC'">3. OS Queue / Semaphore</text><text x="30" y="296.512" fill="#000" font-size="14" textLength="275.463" font-family="'Noto Sans CJK SC'">(包含等待链表与调度上下文切换，适度使用)</text></g><!--entity p4--><g class="entity" data-qualified-name="p4" id="ent0004" data-source-line="8"><rect x="6" 