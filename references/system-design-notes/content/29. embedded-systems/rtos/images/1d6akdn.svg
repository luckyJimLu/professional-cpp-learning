<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:457px;height:446px;background:#FFFFFF;" width="457px" height="446px" viewBox="0 0 457 446" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--entity p1--><g class="entity" data-qualified-name="p1" id="ent0001" data-source-line="5"><rect x="44" y="12" width="359.387" height="60.544" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="54" y="38.24" fill="#000" font-size="14" textLength="125.79" font-family="'Noto Sans CJK SC'">1. Task Notification</text><text x="54" y="58.512" fill="#000" font-size="14" textLength="339.387" font-family="'Noto Sans CJK SC'">(Lightest: Zero RAM control block, directly uses TCB)</text></g><!--entity p2--><g class="entity" data-qualified-name="p2" id="ent0002" data-source-line="6"><rect x="6" y="131" width="435.336" height="60.544" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="16" y="157.24" fill="#000" font-size="14" textLength="124.712" font-family="'Noto Sans CJK SC'">2. SPSC Ring Buffer</text><text x="16" y="177.512" fill="#000" font-size="14" textLength="415.336" font-family="'Noto Sans CJK SC'">(Lock-free single-producer single-consumer, minimal overhead)</text></g><!--entity p3--><g class="entity" data-qualified-name="p3" id="ent0003" data-source-line="7"><rect x="52.5" y="250" width="341.971" height="60.544" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="62.5" y="276.24" fill="#000" font-size="14" textLength="167.117" font-family="'Noto Sans CJK SC'">3. OS Queue / Semaphore</text><text x="62.5" y="296.512" fill="#000" font-size="14" textLength="321.971" font-family="'Noto Sans CJK SC'">(Requires wait-lists &amp; scheduler context switches)</text></g><!--entity p4--><g class="entity" data-qualified-name="p4" id="ent0004" data-source-line="8"><rect x="10.5" y="369" width="426.236" height="60.544" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="20.5" y="395.24" fill="#000" font-size="14" textLength="228.871" font-family="'Noto Sans CJK SC'">4. Complex Shared Mutexes / Locks</text><text x="20.5" y="415.512" fill="#000" font-size="14" textLength="406.236" font-family="'Noto Sans CJK SC'">(Requires priority inheritance &amp; strict ordering, lowest priority)</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-link-type="dependency"><polygon points="223.5,130.985,227.5,121.985,223.5,125.985,219.5,121.985,223.5,130.985" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M223.5,73.024 C223.5,90.76 223.5,108.251 223.5,125.985" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="225.5" y="108.08" fill="#000" font-size="13" textLength="128.219" font-family="'Noto Sans CJK SC'">Needs Data Buffering</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk6" data-link-type="dependency"><polygon points="223.5,249.985,227.5,240.985,223.5,244.985,219.5,240.985,223.5,249.985" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M223.5,192.024 C223.5,209.76 223.5,227.251 223.5,244.985" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="225.5" y="227.08" fill="#000" font-size="13" textLength="199.42" font-family="'Noto Sans CJK SC'">Needs Multi-Producer/Consumer</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk7" data-link-type="dependency"><polygon points="223.5,368.985,227.5,359.985,223.5,363.985,219.5,359.985,223.5,368.985" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M223.5,311.024 C223.5,328.76 223.5,346.251 223.5,363.985" style="stroke:#1818