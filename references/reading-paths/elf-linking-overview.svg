<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">从源码到运行：拆解 ELF 与链接的底层原理</title>
  <desc id="desc">展示源码与汇编、ELF 目标文件、静态与动态链接、内存装载、启动与运行五个阶段。</desc>
  <rect width="1280" height="720" fill="#091522"/>
  <style>
    .panel{fill:#10283a;stroke:#27718a;stroke-width:2}.box{fill:#123247;stroke:#35b8c9;stroke-width:2}.gold{fill:#513b19;stroke:#e7a72b;stroke-width:2}.t{font-family:Arial,'Noto Sans SC',sans-serif;fill:#f3f7fa}.muted{fill:#b3c0c8}.cyan{fill:#36d9e4}.orange{fill:#ffb52f}.small{font-size:16px}.body{font-size:20px}.head{font-size:25px;font-weight:bold}.title{font-size:39px;font-weight:bold}
  </style>
  <text x="42" y="55" class="t title"><tspan class="cyan">从源码到运行：</tspan>拆解 <tspan class="orange">ELF</tspan> 与链接的底层原理</text>
  <text x="45" y="87" class="muted" font-size="23">From Source to Runtime: Demystifying ELF &amp; Linking</text>
  <rect x="24" y="112" width="420" height="260" rx="8" class="panel"/><text x="42" y="145" class="t head">1. 源码与汇编（起源）</text>
  <rect x="43" y="166" width="155" height="130" rx="5" class="box"/><text x="54" y="191" class="t body">C++ 源码</text><text x="54" y="222" class="muted small">int global_val = 42;</text><text x="54" y="248" class="muted small">void main() {</text><text x="54" y="272" class="muted small">  ext_func();</text>
  <path d="M205 230h50" stroke="#35d9e4" stroke-width="3" marker-end="url(#a)"/><text x="205" y="212" class="cyan small">编译</text>
  <rect x="266" y="166" width="155" height="130" rx="5" class="box"/><text x="278" y="191" class="t body">汇编/机器码</text><text x="278" y="222" class="muted small">mov &amp;global</text><text x="278" y="248" class="muted small">call &amp;ext_func</text><text x="278" y="274" class="orange small">地址未确定</text>
  <rect x="460" y="112" width="360" height="260" rx="8" class="panel"/><text x="478" y="145" class="t head">2. ELF 目标文件（核心剖析）</text>
  <rect x="480" y="166" width="165" height="36" class="box"/><text x="500" y="191" class="t body">.text 指令</text><rect x="480" y="207" width="165" height="36" class="box"/><text x="500" y="232" class="t body">.rodata 只读</text><rect x="480" y="248" width="165" height="36" class="box"/><text x="500" y="273" class="t body">.data 已初始化</text><rect x="480" y="289" width="165" height="36" class="gold"/><text x="500" y="314" class="t body">.bss 未初始化</text>
  <text x="666" y="201" class="muted small">符号表</text><text x="666" y="236" class="muted small">重定位表</text><text x="666" y="271" class="orange small">ext_func → 待解析</text>
  <path d="M830 230h35" stroke="#35d9e4" stroke-width="3" marker-end="url(#a)"/>
  <rect x="875" y="112" width="380" height="260" rx="8" class="panel"/><text x="893" y="145" class="t head">3. 静态与动态链接（转化）</text><text x="895" y="181" class="orange body">静态链接</text><text x="895" y="217" class="muted body">.o + .a → 可执行文件</text><text x="895" y="249" class="small muted">符号决议与重定位</text><text x="895" y="288" class="orange body">动态链接</text><text x="895" y="323" class="muted body">.so ↔ GOT/PLT</text><text x="895" y="351" class="small muted">延迟绑定，运行时确定地址</text>
  <rect x="24" y="394" width="796" height="284" rx="8" class="panel"/><text x="42" y="428" class="t head">4. 从 ELF 到内存装载（质变）</text><text x="48" y="468" class="cyan body">链接视角：Sections</text><text x="48" y="505" class="muted body">.text  ·  .rodata  ·  .data  ·  .bss</text><path d="M360 510h80" stroke="#35d9e4" stroke-width="3" marker-end="url(#a)"/><text x="460" y="468" class="orange body">装载视角：Segments</text><text x="460" y="505" class="muted body">Code (R-X)  /  Data (RW-)</text><path d="M665 510h60" stroke="#35d9e4" stroke-width="3" marker-end="url(#a)"/><text x="735" y="468" class="t body">进程布局</text><text x="735" y="505" class="muted small">Text → Data → Heap → Stack</text><text x="48" y="605" class="muted small">Program Header 将 section 组织为装载段，装载器映射为进程地址空间。</text>
  <rect x="840" y="394" width="415" height="284" rx="8" class="panel"/><text x="858" y="428" class="t head">5. 启动与运行：生命的起点</text><text x="875" y="484" class="muted body">_start → __libc_start_main</text><path d="M1064 494v42" stroke="#35d9e4" stroke-width="3" marker-end="url(#a)"/><rect x="952" y="548" width="160" height="40" class="box"/><text x="995" y="575" class="t body">.init_array</text><path d="M1115 568h65" stroke="#35d9e4" stroke-width="3" marker-end="url(#a)"/><text x="1187" y="575" class="t body">main()</text><text x="868" y="638" class="muted small">全局对象初始化 → main → __cxa_atexit 清理</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#35d9e4"/></marker></defs>
</svg>
