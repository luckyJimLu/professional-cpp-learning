<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">C++ 反汇编与逆向分析核心原理</title>
  <desc id="desc">从汇编视角解释函数栈帧、成员函数 this 传递、虚函数表、异常展开和优化变形。</desc>
  <rect width="1280" height="720" fill="#0b1422"/>
  <style>
    .panel{fill:#132b3b;stroke:#3e6378;stroke-width:2}.box{fill:#12364c;stroke:#43c4d6;stroke-width:2}.gold{fill:#4d371b;stroke:#e5a72e;stroke-width:2}.t{font-family:Arial,'Noto Sans SC',sans-serif;fill:#f3f7fa}.muted{fill:#bfccd3}.cyan{fill:#46dbe5}.orange{fill:#ffb638}.head{font-size:25px;font-weight:bold}.body{font-size:19px}.small{font-size:16px}.title{font-size:37px;font-weight:bold}.line{stroke:#57d9e7;stroke-width:3;fill:none}
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#57d9e7"/></marker></defs>
  <text x="40" y="52" class="t title"><tspan class="cyan">C++ 反汇编与逆向分析核心原理：</tspan>从汇编视角透视语言特性</text>
  <text x="45" y="84" class="muted" font-size="22">函数栈帧 · 成员调用 · 虚表机制 · 异常控制流 · 优化变形</text>
  <rect x="22" y="112" width="600" height="240" rx="9" class="panel"/><text x="42" y="146" class="t head">函数栈帧与调用约定</text><text x="48" y="187" class="cyan body">High Address</text><path d="M120 178v125" class="line" marker-end="url(#arrow)"/><rect x="158" y="165" width="170" height="38" class="box"/><text x="216" y="191" class="t body">参数区</text><rect x="158" y="204" width="170" height="38" class="gold"/><text x="193" y="230" class="t body">返回地址</text><rect x="158" y="243" width="170" height="38" class="box"/><text x="192" y="269" class="t body">Saved RBP</text><rect x="158" y="282" width="170" height="38" class="box"/><text x="184" y="308" class="t body">局部变量区</text><text x="376" y="210" class="cyan body">ESP / RSP</text><text x="376" y="250" class="orange body">EBP / RBP</text><text x="376" y="297" class="muted small">-fomit-frame-pointer</text><text x="376" y="322" class="muted small">会改变可见栈帧形状</text>
  <rect x="646" y="112" width="612" height="240" rx="9" class="panel"/><text x="666" y="146" class="t head">成员函数调用与 this 指针传递</text><text x="670" y="187" class="muted body">obj.func(10);</text><rect x="835" y="164" width="112" height="100" class="box"/><text x="872" y="192" class="t body">RDI</text><text x="872" y="226" class="muted small">this</text><text x="872" y="250" class="muted small">arg 10</text><path d="M770 211h58" class="line" marker-end="url(#arrow)"/><rect x="1000" y="164" width="140" height="100" class="gold"/><text x="1022" y="193" class="t body">对象布局</text><text x="1025" y="226" class="muted small">this + offset</text><text x="1025" y="250" class="muted small">成员变量</text><path d="M950 214h44" class="line" marker-end="url(#arrow)"/><text x="674" y="310" class="orange small">Linux SysV 与 MSVC 使用不同调用约定，逆向前先确认 ABI</text>
  <rect x="22" y="375" width="600" height="240" rx="9" class="panel"/><text x="42" y="409" class="t head">虚函数调用机制与“去虚化”</text><rect x="55" y="442" width="120" height="110" class="box"/><text x="86" y="469" class="t body">对象</text><text x="78" y="503" class="muted small">vptr</text><text x="78" y="530" class="muted small">成员数据</text><path d="M177 484h64" class="line" marker-end="url(#arrow)"/><rect x="250" y="442" width="135" height="110" class="gold"/><text x="288" y="469" class="t body">vtable</text><text x="272" y="503" class="muted small">slot 0: 函数</text><text x="272" y="530" class="muted small">slot 1: 函数</text><path d="M388 490h65" class="line" marker-end="url(#arrow)"/><text x="465" y="468" class="orange body">间接调用</text><text x="465" y="500" class="muted small">call [vptr + index*8]</text><text x="465" y="546" class="cyan small">类型已知时：直接调用／内联</text>
  <rect x="646" y="375" width="612" height="240" rx="9" class="panel"/><text x="666" y="409" class="t head">异常控制流：try/catch 与栈展开</text><rect x="680" y="446" width="125" height="92" class="box"/><text x="723" y="478" class="t body">try</text><text x="713" y="510" class="muted small">throw</text><path d="M810 490h55" class="line" marker-end="url(#arrow)"/><rect x="875" y="446" width="155" height="92" class="gold"/><text x="909" y="478" class="t body">展开运行库</text><text x="906" y="510" class="muted small">.eh_frame</text><path d="M1035 490h50" class="line" marker-end="url(#arrow)"/><rect x="1090" y="446" width="135" height="92" class="box"/><text x="1126" y="478" class="t body">catch</text><text x="1109" y="510" class="muted small">Landing Pad</text><text x="671" y="583" class="orange small">正常路径查表成本低；抛出时搜索处理器并执行清理</text>
  <rect x="22" y="640" width="1236" height="58" rx="7" class="gold"/><text x="42" y="675" class="t body">逆向实验提示：</text><text x="214" y="675" class="muted body">确认架构与 ABI → 保存 O0/O2 汇编 → 对照栈与对象布局 → 区分编译器优化和语言语义</text>
</svg>
