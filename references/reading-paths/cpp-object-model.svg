<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">深度探索 C++ 对象模型：从内存布局到编译期合成机制</title>
  <desc id="desc">展示特殊成员函数合成、多继承布局、EBO 与尾部填充、成员函数指针和现代五法则。</desc>
  <rect width="1280" height="720" fill="#0a1422"/>
  <style>
    .panel{fill:#132b3c;stroke:#3d657a;stroke-width:2}.box{fill:#12384c;stroke:#43c7d7;stroke-width:2}.gold{fill:#4e3719;stroke:#e4a72c;stroke-width:2}.t{font-family:Arial,'Noto Sans SC',sans-serif;fill:#f4f8fa}.muted{fill:#c0ccd3}.cyan{fill:#43e0e8}.orange{fill:#ffb735}.head{font-size:25px;font-weight:bold}.body{font-size:19px}.small{font-size:16px}.title{font-size:37px;font-weight:bold}.line{stroke:#5bdded;stroke-width:3;fill:none}
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5bdded"/></marker></defs>
  <text x="40" y="52" class="t title"><tspan class="cyan">深度探索 C++ 对象模型：</tspan>从内存布局到编译期合成机制</text>
  <text x="45" y="84" class="muted" font-size="22">特殊成员合成 · 继承内存布局 · 虚表与 Thunk · 成员函数指针 · 现代标准演进</text>
  <rect x="22" y="112" width="600" height="250" rx="9" class="panel"/><text x="42" y="146" class="t head">特殊成员函数的“按需合成”与平凡性</text><text x="46" y="185" class="cyan body">非平凡默认／拷贝构造</text><text x="50" y="222" class="muted body">① 含非平凡构造的成员对象</text><text x="50" y="253" class="muted body">② 继承自含非平凡构造的基类</text><text x="50" y="284" class="muted body">③ 声明或继承虚函数，需初始化 vptr</text><text x="50" y="315" class="muted body">④ 存在虚基类，需要设置偏移</text><rect x="425" y="174" width="173" height="130" rx="7" class="gold"/><text x="442" y="202" class="orange body">关键边界</text><text x="442" y="232" class="muted small">成员不会因为是 int</text><text x="442" y="256" class="muted small">就自动清零；</text><text x="442" y="280" class="muted small">初始化和生成规则</text><text x="442" y="301" class="muted small">取决于上下文。</text>
  <rect x="646" y="112" width="612" height="250" rx="9" class="panel"/><text x="666" y="146" class="t head">多继承下的内存布局</text><text x="678" y="180" class="cyan body">单继承</text><rect x="670" y="196" width="116" height="112" class="box"/><text x="696" y="224" class="t body">vptr</text><text x="691" y="260" class="muted small">Base 成员</text><text x="691" y="292" class="muted small">Derived 成员</text><text x="830" y="180" class="cyan body">多重继承</text><rect x="824" y="196" width="140" height="112" class="box"/><text x="844" y="224" class="t body">Base1</text><text x="844" y="252" class="muted small">vptr + 成员</text><rect x="978" y="196" width="140" height="112" class="box"/><text x="998" y="224" class="t body">Base2</text><text x="998" y="252" class="muted small">vptr + 成员</text><path d="M965 250h12" class="line" marker-end="url(#arrow)"/><text x="838" y="342" class="orange small">Base2* 可能需要调整 this；Thunk 负责跳转</text><text x="1130" y="180" class="cyan body">虚继承</text><rect x="1130" y="196" width="105" height="112" class="gold"/><text x="1146" y="224" class="t small">偏移表</text><text x="1144" y="256" class="muted small">共享虚基类</text>
  <rect x="22" y="386" width="600" height="205" rx="9" class="panel"/><text x="42" y="420" class="t head">对齐、尾部填充与 EBO</text><rect x="52" y="454" width="160" height="58" class="box"/><text x="82" y="489" class="t body">Base</text><rect x="212" y="454" width="88" height="58" class="gold"/><text x="227" y="489" class="t body">Tail</text><rect x="300" y="454" width="180" height="58" class="box"/><text x="326" y="489" class="t body">Derived 成员</text><text x="54" y="542" class="muted small">尾部填充可能被后续成员复用</text><rect x="52" y="554" width="160" height="25" class="box"/><text x="86" y="573" class="t small">Empty（独立）</text><rect x="300" y="554" width="180" height="25" class="gold"/><text x="318" y="573" class="t small">EBO：空基类不占额外空间</text>
  <rect x="646" y="386" width="612" height="205" rx="9" class="panel"/><text x="666" y="420" class="t head">成员函数指针：不总是 8 字节地址</text><text x="674" y="463" class="cyan body">普通成员函数</text><text x="674" y="494" class="muted body">ptr = 函数代码地址，adj = 0</text><text x="674" y="534" class="cyan body">虚成员函数</text><text x="674" y="565" class="muted body">ptr = vtable 字节偏移 + 1，adj = this 调整值</text>
  <rect x="22" y="618" width="1236" height="70" rx="8" class="gold"/><text x="42" y="649" class="t body">Lippman 经典模型 ↔ 现代 C++ 标准：</text><text x="500" y="649" class="muted body">隐式声明与平凡性 · 移动抑制规则 · =default/=delete 与五法则</text><text x="42" y="677" class="orange small">用 sizeof、alignof、-fdump-lang-class 和目标 ABI 验证；不要把某个编译器布局当成标准保证。</text>
</svg>
