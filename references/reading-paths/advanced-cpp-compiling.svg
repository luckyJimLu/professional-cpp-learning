<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">高级 C/C++ 编译技术全景图：静态库、动态库与 ABI 兼容</title>
  <desc id="desc">对比静态库成员提取、动态库 PIC 与 GOT/PLT、动态符号重定位以及 ABI 兼容边界。</desc>
  <rect width="1280" height="720" fill="#0b1725"/>
  <style>
    .panel{fill:#13283a;stroke:#395b70;stroke-width:2}.box{fill:#12344b;stroke:#40b9d4;stroke-width:2}.gold{fill:#493519;stroke:#e3a72b;stroke-width:2}.t{font-family:Arial,'Noto Sans SC',sans-serif;fill:#f3f7fa}.muted{fill:#becad1}.cyan{fill:#40d9e5}.orange{fill:#ffb633}.head{font-size:25px;font-weight:bold}.body{font-size:19px}.small{font-size:16px}.title{font-size:37px;font-weight:bold}.line{stroke:#54d4e5;stroke-width:3;fill:none}
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#54d4e5"/></marker></defs>
  <text x="40" y="52" class="t title">高级 C/C++ 编译技术全景图：拆解静态库、动态库与 ABI 兼容</text>
  <rect x="22" y="82" width="600" height="290" rx="9" class="panel"/><text x="42" y="116" class="t head">静态库（.a）的本质与成员提取</text>
  <rect x="45" y="157" width="96" height="55" class="box"/><text x="73" y="191" class="t body">a.cpp</text><rect x="45" y="246" width="96" height="55" class="box"/><text x="73" y="280" class="t body">b.cpp</text>
  <path d="M145 184h45M145 273h45" class="line" marker-end="url(#arrow)"/><rect x="190" y="157" width="92" height="55" class="gold"/><text x="215" y="191" class="t body">a.o</text><rect x="190" y="246" width="92" height="55" class="gold"/><text x="215" y="280" class="t body">b.o</text>
  <path d="M285 184h43M285 273h43" class="line" marker-end="url(#arrow)"/><rect x="330" y="204" width="142" height="66" class="box"/><text x="352" y="233" class="t body">ar -cr</text><text x="348" y="256" class="muted small">libdemo.a</text>
  <path d="M475 237h40" class="line" marker-end="url(#arrow)"/><rect x="520" y="157" width="78" height="55" class="gold"/><text x="546" y="191" class="t body">app</text><rect x="520" y="246" width="78" height="55" class="box"/><text x="543" y="280" class="t body">a.o</text><text x="334" y="320" class="orange small">链接器只提取解决未定义符号所需成员</text>
  <rect x="646" y="82" width="612" height="290" rx="9" class="panel"/><text x="666" y="116" class="t head">动态库（.so）与位置无关代码（PIC）</text>
  <rect x="670" y="204" width="105" height="62" class="box"/><text x="694" y="242" class="t body">libdemo.so</text><path d="M780 235h48" class="line" marker-end="url(#arrow)"/><rect x="832" y="150" width="125" height="62" class="box"/><text x="861" y="188" class="t body">GOT</text><rect x="832" y="246" width="125" height="62" class="gold"/><text x="861" y="284" class="t body">PLT</text><path d="M960 181h57M960 278h57" class="line" marker-end="url(#arrow)"/><rect x="1020" y="204" width="110" height="62" class="gold"/><text x="1044" y="242" class="t body">ld.so</text><text x="668" y="335" class="orange small">代码段不写绝对地址；GOT/PLT 延迟绑定动态符号</text>
  <rect x="22" y="394" width="600" height="292" rx="9" class="panel"/><text x="42" y="428" class="t head">动态符号与重定位的差异</text>
  <rect x="45" y="461" width="270" height="46" class="box"/><text x="132" y="491" class="t body">静态链接：Build-Time</text><rect x="329" y="461" width="270" height="46" class="gold"/><text x="413" y="491" class="t body">动态链接：Load/Run-Time</text><text x="48" y="553" class="muted body">静态：修改代码段中的重定位</text><text x="332" y="553" class="muted body">动态：.dynsym + .rel.dyn/.rel.plt</text><text x="48" y="610" class="muted body">符号和地址在链接时确定</text><text x="332" y="610" class="muted body">GOT 记录运行时解析后的地址</text><text x="48" y="655" class="cyan small">工具：ar 归档 · nm 列符号 · objdump 反汇编 · readelf 解析 ELF · ldd 查看依赖</text>
  <rect x="646" y="394" width="612" height="292" rx="9" class="panel"/><text x="666" y="428" class="t head">ABI 二进制兼容性：源代码没改 ≠ 二进制兼容</text><text x="670" y="470" class="cyan body">需要同时核对五类契约</text>
  <text x="684" y="510" class="orange body">A. 名字修饰</text><text x="880" y="510" class="muted small">符号名与编译器/版本匹配</text><text x="684" y="548" class="orange body">B. 调用约定</text><text x="880" y="548" class="muted small">寄存器、栈与 callee 责任</text><text x="684" y="586" class="orange body">C. 对象布局</text><text x="880" y="586" class="muted small">虚表、偏移、对齐与填充</text><text x="684" y="624" class="orange body">D. 异常与运行库</text><text x="880" y="624" class="muted small">展开格式、libstdc++/glibc 版本</text><text x="684" y="662" class="orange body">E. 导出边界</text><text x="880" y="662" class="muted small">C 接口、分配/释放方与可见性</text>
</svg>
