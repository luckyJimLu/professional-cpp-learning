<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">STL 源码剖析与 GCC 内存/类型擦除底层机制</title>
  <desc id="desc">展示空间配置器、对象构造分离、shared_ptr 控制块、迭代器 traits 和 std::function 小对象优化。</desc>
  <rect width="1280" height="720" fill="#101719"/>
  <style>
    .panel{fill:#132b2b;stroke:#3d6865;stroke-width:2}.box{fill:#123d3d;stroke:#4bd3b5;stroke-width:2}.gold{fill:#493719;stroke:#e6a832;stroke-width:2}.t{font-family:Arial,'Noto Sans SC',sans-serif;fill:#f2f8f5}.muted{fill:#c4d2cd}.cyan{fill:#58e5bc}.orange{fill:#ffb63b}.head{font-size:25px;font-weight:bold}.body{font-size:19px}.small{font-size:16px}.title{font-size:37px;font-weight:bold}.line{stroke:#65e5c1;stroke-width:3;fill:none}
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#65e5c1"/></marker></defs>
  <text x="40" y="52" class="t title"><tspan class="cyan">STL 源码剖析与 GCC 内存/类型擦除底层机制</tspan></text>
  <text x="45" y="84" class="muted" font-size="22">空间配置器 · 迭代器 traits · 智能指针 · 类型擦除 std::function</text>
  <rect x="22" y="112" width="600" height="250" rx="9" class="panel"/><text x="42" y="146" class="t head">SGI STL 级空间配置器与对象分离</text><rect x="48" y="177" width="155" height="44" class="gold"/><text x="72" y="206" class="t body">大对象 → malloc</text><rect x="48" y="240" width="155" height="44" class="box"/><text x="72" y="269" class="t body">小对象 → free list</text><path d="M210 230h54" class="line" marker-end="url(#arrow)"/><rect x="270" y="191" width="150" height="80" class="box"/><text x="294" y="222" class="t body">allocate(n)</text><text x="290" y="250" class="muted small">只申请原始存储</text><path d="M426 230h50" class="line" marker-end="url(#arrow)"/><rect x="486" y="177" width="112" height="44" class="gold"/><text x="514" y="206" class="t body">placement new</text><rect x="486" y="240" width="112" height="44" class="box"/><text x="518" y="269" class="t body">destroy</text><text x="48" y="326" class="orange small">allocator 负责存储；构造/析构负责对象生命周期</text>
  <rect x="646" y="112" width="612" height="250" rx="9" class="panel"/><text x="666" y="146" class="t head">shared_ptr 控制块与合并分配</text><rect x="670" y="190" width="122" height="92" class="box"/><text x="687" y="220" class="t body">shared_ptr</text><text x="689" y="250" class="muted small">对象指针</text><path d="M798 213h45M798 259h45" class="line" marker-end="url(#arrow)"/><rect x="850" y="173" width="180" height="136" class="gold"/><text x="885" y="201" class="t body">Control Block</text><text x="870" y="230" class="muted small">strong / weak count</text><text x="870" y="255" class="muted small">deleter + allocator</text><text x="870" y="280" class="muted small">管理销毁与控制块</text><rect x="1050" y="190" width="170" height="92" class="box"/><text x="1078" y="220" class="t body">make_shared</text><text x="1066" y="250" class="muted small">对象与控制块</text><text x="1066" y="274" class="muted small">常见合并分配</text>
  <rect x="22" y="386" width="600" height="235" rx="9" class="panel"/><text x="42" y="420" class="t head">迭代器分类与 traits 萃取</text><text x="52" y="462" class="cyan body">Input → Forward → Bidirectional → Random Access</text><path d="M80 500h420" class="line" marker-end="url(#arrow)"/><rect x="74" y="524" width="170" height="48" class="box"/><text x="104" y="555" class="t body">iterator_traits&lt;T&gt;</text><path d="M250 548h60" class="line" marker-end="url(#arrow)"/><rect x="320" y="524" width="250" height="48" class="gold"/><text x="345" y="555" class="t body">value_type / category</text><text x="52" y="604" class="muted small">编译期提取能力，算法据此选择实现路径</text>
  <rect x="646" y="386" width="612" height="235" rx="9" class="panel"/><text x="666" y="420" class="t head">std::function：类型擦除与小对象优化 SBO</text><rect x="674" y="465" width="148" height="98" class="box"/><text x="705" y="495" class="t body">Function</text><text x="696" y="525" class="muted small">buffer</text><text x="696" y="550" class="muted small">invoker</text><path d="M828 500h58" class="line" marker-end="url(#arrow)"/><rect x="892" y="452" width="150" height="48" class="box"/><text x="917" y="483" class="t body">小 callable</text><rect x="892" y="520" width="150" height="48" class="gold"/><text x="917" y="551" class="t body">大 callable</text><text x="1064" y="482" class="cyan small">SBO：buffer 内</text><text x="1064" y="505" class="muted small">可能免分配</text><text x="1064" y="549" class="orange small">可能外部存储</text><text x="1064" y="572" class="muted small">仍需管理器</text>
  <rect x="22" y="646" width="1236" height="48" rx="7" class="gold"/><text x="42" y="677" class="t body">源码对照路径：</text><text x="225" y="677" class="muted body">allocator → bits/shared_ptr_base.h → bits/std_function.h；SGI allocator 是历史背景，布局与缓冲大小以当前 libstdc++ 为准。</text>
</svg>
