name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.select.outputs.app }}
      content: ${{ steps.select.outputs.content }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select pipeline (app rebuild vs content refresh)
        id: select
        shell: bash
        run: |
          set -euo pipefail
          app_re='^(src/|public/|vite\.config\.ts$|tsconfig\.json$|eslint\.config\.js$|package\.json$|package-lock\.json$|bun\.lock$|playwright\.config\.ts$|index\.html$|rtos\.html$|metadata\.json$|scripts/build-content\.py$|include/|\.github/workflows/deploy\.yml$)'
          content_re='^(daily/|weekly/|patterns/|booklets/|guidelines/|frameworks/|references/|docs/|assets/|progress\.md$|README\.md$)'

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            app=true
            content=false
          else
            before="${{ github.event.before }}"
            sha="${{ github.sha }}"
            zero_sha="0000000000000000000000000000000000000000"

            if [ -n "$before" ] && [ "$before" != "$zero_sha" ] && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              changed="$(git diff --name-only "$before" "$sha")"
            elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              changed="$(git diff --name-only HEAD^ HEAD)"
            else
              changed=""
            fi

            echo "=== Changed files ==="
            echo "$changed"

            if [ -z "$changed" ]; then
              # 首次推送、强制推送或无法计算 diff 时，默认触发全量发布，避免误跳过
              app=true
              content=false
            else
              # 保留换行符逐行匹配，修复原 tr '\n' ' ' 导致 ^ / $ 锚点失效而跳过发布的问题
              match() { printf '%s\n' "$changed" | grep -Eq "$1" && echo true || echo false; }
              app="$(match "$app_re")"
              content="$(match "$content_re")"
            fi
          fi

          # 应用侧文件变更时全量重建即可覆盖内容；仅内容变更走快速通道
          if [ "$app" = "true" ]; then
            content="false"
          fi

          echo "Selected pipeline -> app=$app, content=$content"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "content=$content" >> "$GITHUB_OUTPUT"

  app-deploy:
    name: Full rebuild and deploy
    if: needs.changes.outputs.app == 'true'
    needs: changes
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify Pages deployment source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"
          if [ "$build_type" != "workflow" ]; then
            echo "::error::Set Settings > Pages > Build and deployment > Source to GitHub Actions. Branch publishing runs Jekyll against the C++ lesson sources instead of deploying dist/."
            exit 1
          fi

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run optional repository content checks
        shell: bash
        env:
          NODE_OPTIONS: "--disable-warning=DEP0040"
        run: |
          set -euo pipefail
          has_script() {
            node -e "const p = JSON.parse(require('fs').readFileSync('package.json','utf8')); process.exit(p.scripts && p.scripts[process.argv[1]] ? 0 : 1)" "$1"
          }
          for script in check:course check:booklets check:migration ppt:check; do
            if has_script "$script"; then
              echo "Running npm run $script ..."
              npm run "$script"
            else
              echo "Skipping npm run $script (not defined in package.json)"
            fi
          done
          if [ -f scripts/build-content.py ]; then
            echo "Running python3 scripts/build-content.py --check ..."
            python3 scripts/build-content.py --check
          else
            echo "Skipping scripts/build-content.py --check (script not present)"
          fi

      - name: Build web application (content pipeline included)
        env:
          GITHUB_PAGES: "true"
          NODE_OPTIONS: "--disable-warning=DEP0040"
        run: npm run build

      - name: Show dist diagnostics
        run: |
          echo "=== Dist directory size ==="
          du -sh ./dist || true
          echo "=== Top-level dist files ==="
          ls -la ./dist || true
          if [ -f ./dist/index.html ]; then
            echo "=== index.html head ==="
            head -n 20 ./dist/index.html
          else
            echo "ERROR: ./dist/index.html missing!"
            exit 1
          fi

      - name: Save dist for the content fast lane
        uses: actions/cache/save@v4
        with:
          path: ./dist
          key: pages-dist-${{ github.sha }}

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
          error_count: 20

  content-deploy:
    name: Content-only refresh and deploy
    if: needs.changes.outputs.content == 'true'
    needs: changes
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify Pages deployment source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"
          if [ "$build_type" != "workflow" ]; then
            echo "::error::Set Settings > Pages > Build and deployment > Source to GitHub Actions. Branch publishing runs Jekyll against the C++ lesson sources instead of deploying dist/."
            exit 1
          fi

      - name: Check content contract
        shell: bash
        run: |
          if [ -f scripts/build-content.py ]; then
            python3 scripts/build-content.py --check
          else
            echo "Skipping scripts/build-content.py --check (script not present)"
          fi

      - name: Restore last deployed dist
        id: dist_cache
        uses: actions/cache/restore@v4
        with:
          path: ./dist
          key: pages-dist-not-exists
          restore-keys: |
            pages-dist-

      - name: Build content tree
        if: steps.dist_cache.outputs.cache-hit
        shell: bash
        run: |
          if [ -f scripts/build-content.py ]; then
            python3 scripts/build-content.py --out dist/content
          else
            echo "scripts/build-content.py not present; keeping cached dist."
          fi

      - name: Fallback full build when cache missing
        if: ${{ !steps.dist_cache.outputs.cache-hit }}
        run: echo "No cached dist found; falling back to a full application build."

      - name: Setup Node.js 24
        if: ${{ !steps.dist_cache.outputs.cache-hit }}
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies (fallback)
        if: ${{ !steps.dist_cache.outputs.cache-hit }}
        run: npm install --no-audit --no-fund

      - name: Build web application (fallback)
        if: ${{ !steps.dist_cache.outputs.cache-hit }}
        env:
          GITHUB_PAGES: "true"
          NODE_OPTIONS: "--disable-warning=DEP0040"
        run: npm run build

      - name: Show dist diagnostics
        run: |
          echo "=== Dist directory size ==="
          du -sh ./dist || true
          if [ -f ./dist/index.html ]; then
            echo "=== index.html head ==="
            head -n 5 ./dist/index.html
          else
            echo "ERROR: ./dist/index.html missing!"
            exit 1
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
          error_count: 20
