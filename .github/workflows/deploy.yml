name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check course content
        run: npm run check:course

      - name: Verify migrated content
        run: npm run check:migration

      - name: Build web application
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Show dist diagnostics
        run: |
          echo "=== Dist directory size ==="
          du -sh ./dist || true
          echo "=== Top-level dist files ==="
          ls -la ./dist || true
          if [ -f ./dist/index.html ]; then
            echo "=== index.html head ==="
            head -n 20 ./dist/index.html
          else
            echo "ERROR: ./dist/index.html missing!"
            exit 1
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
          error_count: 20
