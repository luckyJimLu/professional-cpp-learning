name: Web Build

on:
  push:
    branches:
      - main
      - "feat/**"
      - "improve/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Check course content
        run: npm run check:course

      - name: Verify migrated content
        run: npm run check:migration

      - name: Check migrated C++ examples
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost1.83-dev
          npm run check:reference-cpp

      - name: Typecheck and build
        run: npm run build

      - name: Compile and run standalone C++ labs and exercises
        shell: bash
        run: |
          python3 tools/check-examples.py

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser compiler and Markdown diagram tests
        run: npm run test:e2e
